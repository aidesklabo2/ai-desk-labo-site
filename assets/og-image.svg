      <stop offset="1" stop-color="#2b66c2"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="rgba(15,14,12,0.07)"/>
