  <circle cx="1332" cy="55" r="59" fill="none" stroke="rgba(15,14,12,0.26)" stroke-width="2.5"/>
  <circle cx="866" cy="573" r="19" fill="#b3560f" opacity="0.55"/>
  <circle cx="1370" cy="270" r="15" fill="#2b66c2"/>
