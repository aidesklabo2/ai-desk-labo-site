  <text x="80" y="468" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="54" font-weight="700" fill="#b3560f">モノ<tspan font-family="Hiragino Sans, Yu Gothic UI, Noto Sans JP, Arial, sans-serif" fill="#121110">を選ぶ。</tspan></text>

